# ==========================================
# Advanced Auto-Labeling Ensemble Config
# ==========================================
# ตัวอย่างการตั้งค่าสำหรับการรัน Auto-Label โดยใช้หลายโมเดลร่วมกัน
# หรือปรับความมั่นใจ (Confidence) แยกรายคลาส

models:
  # ---------------------------------------------
  # โมเดลที่ 1: YOLOv8-Animals (รับจบส่วนใหญ่)
  # ---------------------------------------------
  - path: "weights/yolov8_animals_v1.pt"
    classes: 
      - "CAT"
      - "DOG"
      - "BIRD"
      - "RABBIT"
      - "FISH"
    
    # ปรับ Conf ตามผล Benchmark: คลาสไหน mAP สูง(>0.95) ให้ Conf สูงๆ ได้
    # คลาสไหน mAP ต่ำ (<0.70) ต้องลด Conf ลงมาช่วยดึงวัตถุ
    class_conf:
      CAT: 0.65               # สมมติว่า mAP 0.99 -> มั่นใจมาก ดัน conf ขึ้นได้
      DOG: 0.60               # สมมติว่า mAP 0.95
      BIRD: 0.40              # สมมติว่านกมักจะตัวเล็ก หาเจอยาก เลยลด conf ลง
      FISH: 0.20              # สมมติว่าปลาหาเจอยากมาก ต้องลาก conf ต่ำๆ
      
    conf_threshold: 0.45  # ค่าเริ่มต้นสำหรับคลาสอื่นๆ
    conf_min: 0.15
    iou_threshold: 0.45

  # ---------------------------------------------
  # โมเดลที่ 2: YOLOv8-Exotics (ตัวซ่อมจุดอ่อน / เก็บตกรอยรั่ว)
  # ---------------------------------------------
  - path: "weights/yolov8_exotics_v2.pt"
    classes: 
      - "HAMSTER"
      - "TURTLE"
      - "SNAKE"
      
    class_conf:
      HAMSTER: 0.50     
      TURTLE: 0.30           
      SNAKE: 0.25     
      
    conf_threshold: 0.40
    conf_min: 0.15
    iou_threshold: 0.45

# ==========================================
# กฎป้องกันการซ้อนทับกัน (Mutual Exclusion)
# ==========================================
mutual_exclusions:
  iou_threshold: 0.80  # ขนาด กว้าง/ยาว ต่างกันไม่เกิน ~10% ให้ดึงเฉพาะตัว Conf สูงสุดไว้
  groups:
    - ["CAT", "DOG"]             # ไม่มีทางเป็นแมวและหมาในตำแหน่งเดียวกันเป๊ะๆ ได้
    - ["HAMSTER", "RABBIT"]