# ==========================================
# Dataset Auditor Config
# ==========================================
# ไฟล์ตั้งค่าสำหรับการตรวจสอบคุณภาพ Dataset 
# สามารถปรับแต่งเงื่อนไขการคัดกรองไฟล์ขยะได้ที่นี่

# วิธีการจัดการไฟล์ที่ไม่ได้คุณภาพ (ย้าย, คัดลอก, ลิงก์)
# ตัวเลือก: 'move', 'copy', 'hardlink'
mode: "move"

# ---------------------------------------------
# 1. การกรองขนาดภาพ (Image Dimensions)
# ---------------------------------------------
dimensions:
  # ความกว้างและสูงขั้นต่ำที่ยอมรับได้ 
  # ถ้าต่ำกว่านี้จะถูกคัดเป็นไฟล์ขยะ (0 = ไม่ตรวจสอบ)
  min_width: 360
  min_height: 360

# ---------------------------------------------
# 2. การหาภาพซ้ำ (Duplicate Detection)
# ---------------------------------------------
duplicates:
  enabled: true
  
  # ระดับความเหมือน (Hamming Distance ของ dHash)
  # 0   = ต้องเป็นรูปเดียวกัน 100% (Binary Match)
  # 2-4 = รูปเดียวกันแต่อาจจะถูกย่อขนาดมา / เปลี่ยนสีนิดหน่อย
  # 6-8 = รูปคล้ายกันมาก (อาจจะครอปมาเล็กน้อย)
  # แนะนำ: 2 สำหรับ Dataset ทั่วไป
  threshold: 2