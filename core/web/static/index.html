<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#161b22">
  <title>YOLO BBox Reviewer</title>
  <link rel="stylesheet" href="/static/css/style.css?v=3.5">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Top Bar: รวมการนำทาง ตัวกรอง คอนฟิเดนซ์ และปุ่มยืนยัน -->
  <header id="topbar">
    <!-- กลุ่มที่ 1: ก่อนหน้า / ถัดไป -->
    <div class="nav-group">
      <button class="btn btn-ghost nav-btn" id="btn-prev">◀</button>
      <button class="btn btn-ghost nav-btn" id="btn-next">▶</button>
    </div>

    <!-- กลุ่ม Filter เดียวแบบรวมศูนย์ (Single Unified Filter Dropdown) -->
    <div class="filter-dropdown-container">
      <button type="button" class="btn btn-ghost filter-trigger-btn" id="btn-filter-trigger">
        <span class="filter-icon">🔍</span>
        <span id="filter-summary-label">Filter</span>
        <span class="caret">▾</span>
      </button>

      <!-- Fallback hidden select for tests & programmatic compatibility -->
      <select id="filter-select" style="display: none;"></select>
    </div>

    <div class="divider-v"></div>

    <!-- กลุ่มที่ 2: Checkbox low-conf และ Dual-Thumb Slider Range บน Track เดียว -->
    <div class="conf-slider-wrap">
      <label class="low-conf-toggle-label">
        <input type="checkbox" id="chk-show-low-conf" checked>
        <span class="chk-label-txt">low-conf</span>
      </label>
      <div class="dual-range-box">
        <span class="conf-title">ช่วง:</span>
        <div class="dual-range-track" id="conf-track">
          <div class="dual-range-highlight" id="conf-slider-highlight"></div>
          <input type="range" id="conf-slider-min" min="0.00" max="1.00" step="0.05" value="0.05">
          <input type="range" id="conf-slider-max" min="0.00" max="1.00" step="0.05" value="0.50">
        </div>
        <span id="conf-val" class="conf-badge">0.05 - 0.50</span>
      </div>
    </div>

    <span id="confirm-badge">✓ ตรวจแล้ว</span>
    <div class="spacer"></div>

    <!-- กลุ่มที่ 3: สถานะ & ปุ่มยืนยัน -->
    <span id="status-label">กำลังโหลด...</span>
    <button class="btn btn-confirm" id="btn-confirm">
      ✓ <span class="confirm-btn-text">ยืนยัน</span>
    </button>
  </header>

  <!-- Main Layout -->
  <main id="main">
    <!-- Left Tools Bar (แนวตั้งด้านซ้าย แตะง่ายด้วยนิ้วโป้งซ้ายในแนวนอน) -->
    <aside id="left-toolbar" class="tools-bar-vertical">
      <button class="tool-btn active" data-tool="select">
        <span class="tool-icon">↖</span>
        <span class="tool-txt">เลือก</span>
      </button>
      <button class="tool-btn" data-tool="draw">
        <span class="tool-icon">⬜</span>
        <span class="tool-txt">วาด</span>
      </button>
      <button class="tool-btn" data-tool="pan">
        <span class="tool-icon">✋</span>
        <span class="tool-txt">เลื่อน</span>
      </button>

      <div class="tool-divider-h"></div>

      <button class="tool-btn" data-tool="undo">
        <span class="tool-icon">↩️</span>
        <span class="tool-txt">ย้อน</span>
      </button>
      <button class="tool-btn" data-tool="delete">
        <span class="tool-icon">🗑️</span>
        <span class="tool-txt">ลบ</span>
      </button>

      <!-- ปุ่มขยาย/เต็มจอ ย้ายมาชิดขอบล่างสุดของ toolbar ด้านซ้าย -->
      <button class="tool-btn tool-btn-bottom" id="btn-fullscreen">
        <span class="tool-icon">⛶</span>
        <span class="tool-txt">ขยาย</span>
      </button>
    </aside>

    <!-- Center Canvas Wrap (พื้นที่ทำงานหลัก กว้างเต็มที่ ไม่ถูกบัง) -->
    <section id="canvas-wrap" class="mode-select">
      <canvas id="canvas-img"></canvas>
      <canvas id="canvas-anno"></canvas>
      <canvas id="canvas-ui"></canvas>

      <!-- Floating Zoom Controls (Solid dark, no blur) -->
      <div id="zoom-overlay">
        <button class="zoom-btn" id="btn-zoom-in">+</button>
        <span id="zoom-text">100%</span>
        <button class="zoom-btn" id="btn-zoom-out">−</button>
        <button class="zoom-btn" id="btn-zoom-fit">⛶ พอดี</button>
        <button class="zoom-btn" id="btn-zoom-100">1:1</button>
      </div>
    </section>

    <!-- Right Labels Panel (เปิดอยู่เสมอถาวร ไม่บังหน้าจอ) -->
    <aside id="right-panel">
      <div class="panel-header" id="label-header">
        <span class="label-header-title">🏷️ Classes</span>
        <div class="sort-toggle" id="sort-controls">
          <button class="sort-btn active" data-sort="alpha">A-Z</button>
          <button class="sort-btn" data-sort="data">ลำดับไฟล์</button>
        </div>
      </div>
      <div id="label-list">
        <!-- รายการ Label จะถูกเรนเดอร์อัตโนมัติผ่าน app.js -->
      </div>
    </aside>
  </main>

  <!-- Filter Popover Modal/Dropdown (Root level so it can NEVER be clipped by topbar overflow) -->
  <div class="filter-popover" id="filter-popover" style="display: none;">
    <div class="filter-popover-top">
      <span class="filter-popover-title">🔍 ตัวกรอง (Filter)</span>
      <button type="button" class="filter-close-btn" id="btn-close-filter">✕</button>
    </div>

    <!-- ส่วนที่ 1: สถานะการตรวจ (Checkbox list: ติ๊กได้หลายสถานะพร้อมกัน) -->
    <div class="filter-section">
      <div class="filter-section-title">📂 สถานะการตรวจ</div>
      <div class="filter-status-options">
        <label class="filter-status-option">
          <input type="checkbox" id="chk-status-all" value="all" checked>
          <span>ภาพทั้งหมด (<span id="status-count-all">0</span>)</span>
        </label>
        <label class="filter-status-option">
          <input type="checkbox" class="chk-status-item" value="unverified">
          <span>⏳ ยังไม่ตรวจ (<span id="status-count-unverified">0</span>)</span>
        </label>
        <label class="filter-status-option">
          <input type="checkbox" class="chk-status-item" value="verified">
          <span>✅ ตรวจแล้ว (<span id="status-count-verified">0</span>)</span>
        </label>
        <label class="filter-status-option">
          <input type="checkbox" class="chk-status-item" value="negative">
          <span>⚪ ไม่มีวัตถุ (<span id="status-count-negative">0</span>)</span>
        </label>
        <label class="filter-status-option" id="opt-low-conf-wrap">
          <input type="checkbox" class="chk-status-item" value="low_conf">
          <span>⚠️ มี Low-Conf (<span id="status-count-lowconf">0</span>)</span>
        </label>
      </div>
    </div>

    <div class="filter-popover-divider"></div>

    <!-- ส่วนที่ 2: คลาสวัตถุ (เลือกกี่คลาสก็ได้ จะ 1000 คลาสก็รองรับ) -->
    <div class="filter-section">
      <div class="filter-section-header">
        <span class="filter-section-title">🏷️ คลาสวัตถุ</span>
        <div class="filter-menu-actions">
          <button type="button" class="btn-text-sm" id="btn-select-all-classes">ทั้งหมด</button>
          <button type="button" class="btn-text-sm" id="btn-clear-classes">ล้างค่า</button>
        </div>
      </div>
      <input type="text" id="class-search-input" class="filter-search-input" placeholder="ค้นหาคลาส...">
      <div class="filter-classes-list" id="filter-classes-checklist">
        <!-- Dynamic checkboxes for classes -->
      </div>
    </div>
  </div>

  <!-- Bottom Bar -->
  <footer id="bottombar">
    <span id="bottom-info">กำลังเชื่อมต่อเซิร์ฟเวอร์...</span>
    <div class="spacer"></div>
    <span>💡 แตะเลือก Bbox แล้วกดชื่อคลาสเพื่อเปลี่ยนชื่อ | กดชื่อคลาสแล้วแตะที่ว่างบนภาพเพื่อสร้าง Bbox</span>
  </footer>

  <!-- Hidden Color Picker -->
  <input type="color" id="color-picker-input">

  <!-- Toast Message -->
  <div id="toast"></div>

  <!-- Scripts: โหลดตามลำดับ SSOT และ Components พร้อม Cache-Buster v=3.7 -->
  <script src="/static/js/constants/enums.js?v=3.7"></script>
  <script src="/static/js/core/event_bus.js?v=3.7"></script>
  <script src="/static/js/core/store.js?v=3.7"></script>
  <script src="/static/js/state.js?v=3.7"></script>
  <script src="/static/js/services/api_client.js?v=3.7"></script>
  <script src="/static/js/canvas/viewport_engine.js?v=3.7"></script>
  <script src="/static/js/canvas/hit_test_engine.js?v=3.7"></script>
  <script src="/static/js/canvas/interaction_fsm.js?v=3.7"></script>
  <script src="/static/js/canvas.js?v=3.7"></script>
  <script src="/static/js/interaction.js?v=3.7"></script>
  <script src="/static/js/components/toolbar.js?v=3.7"></script>
  <script src="/static/js/components/topbar.js?v=3.7"></script>
  <script src="/static/js/components/label_drawer.js?v=3.7"></script>
  <script src="/static/js/components/zoom_controls.js?v=3.7"></script>
  <script src="/static/js/components/shortcuts.js?v=3.7"></script>
  <script src="/static/js/app.js?v=3.7"></script>
</body>
</html>
