# ==========================================
# YOLO Training Config Template
# ==========================================
# ไฟล์ตั้งค่าสำหรับการรันคำสั่ง Train

# พาธไฟล์โมเดลเริ่มต้น (Pre-trained weights) และไฟล์ Data
model: "yolov8n.pt"
data: "data.yaml"

# ---------------------------------------------
# 1. Training Parameters
# ---------------------------------------------
epochs: 100
imgsz: 640
batch: 16
device: "0"          # "0" สำหรับ GPU หรือ "cpu"
workers: 8           # จำนวน CPU Thread สำหรับโหลดข้อมูล
patience: 50         # หยุดเทรนอัตโนมัติถ้า mAP ไม่ดีขึ้นใน 50 epoch
lr0: 0.01            # Learning Rate เริ่มต้น
close_mosaic: 10     # ปิด Mosaic Augmentation ในช่วง 10 epoch สุดท้าย

# ---------------------------------------------
# 2. Project Settings
# ---------------------------------------------
project: "runs/train"
name: "yolo_model"
auto_export: true    # แปลงเป็น ONNX อัตโนมัติเมื่อเทรนเสร็จ
resume: false        # รันเทรนต่อจากรอบที่แล้ว (ต้องการ weights/last.pt)
freeze: null         # จำนวน Layer ที่ต้องการ Freeze ไม่ให้โดนเทรน (เว้นว่างไว้เพื่อเทรนทั้งหมด)

# ---------------------------------------------
# 3. Augmentations (การปรับแต่งภาพระหว่างเทรน)
# ---------------------------------------------
augmentations:
  enabled: true
  degrees: 0.0       # หมุนภาพ (องศา)
  fliplr: 0.5        # พลิกซ้ายขวา (โอกาส 50%)
  flipud: 0.0        # พลิกบนล่าง
  perspective: 0.0   # บิดมุมมอง
  shear: 0.0         # ตัดเฉือน
  scale: 0.5         # ย่อขยายภาพ +/- 50%
  hsv_v: 0.4         # ปรับความสว่าง (Value) 40%